name: ci

on:
  push:
    branches: [ main, release/*, feature/* ]
  pull_request:
    branches: [ main, release/* ]

jobs:
  macos:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Install nats-server
      run: curl --fail https://binaries.nats.dev/nats-io/nats-server/v2@latest | PREFIX='/usr/local/bin' sh
    - name: Check nats-server version
      run: nats-server -v
    - name: List schemes
      run: xcodebuild -list
    - name: Build
      run: xcodebuild build -scheme Nats -destination 'platform=macOS,arch=arm64'
    - name: Test
      run: swift test
    - name: Run JetStream example
      run: |
        nats-server -js -p 4333 &
        sleep 1
        NATS_URL=nats://localhost:4333 swift run JetStreamExample
  apple-platforms:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Build libraries
      run: |
        for scheme in Nats JetStream JetStreamKeyValue JetStreamObjectStore; do
          xcodebuild build -scheme $scheme -destination "generic/platform=${{ matrix.platform }}"
        done
  check-linter:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Install swift-format
      run: brew install swift-format
    - name: Run check
      run: swift-format lint --configuration .swift-format -r --strict Sources Tests
