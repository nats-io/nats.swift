# A node of a cluster with websocket clients over TLS, which advertises 127.0.0.1 for them.
# The arguments are the certificate, its key and the routes line.
listen: 127.0.0.1:-1

websocket {
  listen: "127.0.0.1:-1"
  tls {
    cert_file:  "%@"
    key_file:   "%@"
  }
}

cluster {
  name: "wss_ip"
  listen: 127.0.0.1:-1
  %@
}
